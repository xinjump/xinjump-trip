  function copyToClipboard(text, tip, btnEl) {
    if (!text) return;
    function done() {
      toast(tip || '✅ 已复制到剪贴板');
      /* 按钮短暂反馈「已复制」 */
      if (btnEl && (btnEl.tagName === 'BUTTON' || btnEl.tagName === 'A')) {
        var old = btnEl.textContent;
        btnEl.classList.add('copied');
        btnEl.textContent = '✅ 已复制';
        setTimeout(function () {
          btnEl.textContent = old;
          btnEl.classList.remove('copied');
        }, 1000);
      }
    }
    function fail() {
      /* 降级：临时 textarea + execCommand（兼容 file:// 场景） */
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        done();
      } catch (e) {
        toast('❌ 复制失败，请手动复制');
      }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fail);
    } else {
      fail();
    }
  }

  function toast(msg) {
    var el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.className = 'toast';
      el.id = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  /* 自定义确认弹窗（Promise 风格，替代浏览器默认 confirm） */
  function showConfirm(opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var mask = document.createElement('div');
      mask.className = 'confirm-mask';
      var danger = opts.danger !== false;
      var icon = danger ? '⚠️' : 'ℹ️';
      var iconCls = danger ? 'danger' : 'warn';
      var okCls = danger ? 'confirm-ok' : 'confirm-ok primary';
      mask.innerHTML =
        '<div class="confirm-box">' +
          '<div class="confirm-icon ' + iconCls + '">' + icon + '</div>' +
          '<div class="confirm-title">' + (opts.title || '确认操作') + '</div>' +
          '<div class="confirm-msg">' + (opts.message || '') + '</div>' +
          '<div class="confirm-actions">' +
            '<button type="button" class="' + okCls + '">' + (opts.okText || '确定') + '</button>' +
            '<button type="button" class="confirm-cancel">' + (opts.cancelText || '取消') + '</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(mask);

      function close(result) {
        mask.classList.remove('show');
        setTimeout(function () { mask.remove(); resolve(result); }, 200);
      }
      mask.querySelector('.confirm-cancel').addEventListener('click', function () { close(false); });
      mask.querySelector('.confirm-ok').addEventListener('click', function () { close(true); });
      /* 点击遮罩空白处 = 取消 */
      mask.addEventListener('click', function (e) {
        if (e.target === mask) close(false);
      });

      /* 触发进入动画 */
      requestAnimationFrame(function () { mask.classList.add('show'); });
    });
  }

  /* ===== 历史与收藏（首页「我的足迹」联动） ===== */
  var HIST_KEY = 'xj-trip-history';
  var FAV_KEY = 'xj-trip-favs';

  function loadJSON(key) {
    try {
      var v = localStorage.getItem(key);
      return v ? JSON.parse(v) : [];
    } catch (e) { return []; }
  }
  function saveJSON(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { /* 忽略 */ }
  }

  /* ===== 地图跳转（高德 / 百度网页版，选择后半小时内免提示） ===== */
  var MAP_KEY = 'xj-trip-map-choice';
  var MAP_TTL = 30 * 60 * 1000; /* 30 分钟过期 */

  /* 读取当前有效的地图选择；过期返回 null */
  function getMapChoice() {
    try {
      var v = localStorage.getItem(MAP_KEY);
      if (!v) return null;
      var o = JSON.parse(v);
      if (!o || !o.provider || !o.expireAt) return null;
      if (Date.now() > o.expireAt) return null;
      return o.provider;
    } catch (e) { return null; }
  }

  function saveMapChoice(provider) {
    saveJSON(MAP_KEY, { provider: provider, expireAt: Date.now() + MAP_TTL });
  }

  /* 构造地图跳转 URL（坐标精确标记） */
  function mapUrl(provider, name, lat, lng) {
    if (provider === 'amap') {
      return 'https://uri.amap.com/marker?position=' + lng + ',' + lat + '&name=' + encodeURIComponent(name) + '&src=xinjump';
    }
    return 'https://api.map.baidu.com/marker?location=' + lat + ',' + lng + '&title=' + encodeURIComponent(name) + '&content=' + encodeURIComponent(name) + '&output=html';
  }

  /* 打开地图：若已有有效选择则直接跳转，否则弹出选择框 */
  function openMap(name, lat, lng) {
    var provider = getMapChoice();
    if (provider) {
      window.open(mapUrl(provider, name, lat, lng), '_blank');
      return;
    }
    showMapPicker(name, lat, lng);
  }

  /* 地图选择弹窗（高德 / 百度 / 取消） */
  function showMapPicker(name, lat, lng) {
    var mask = document.createElement('div');
    mask.className = 'map-picker';
    mask.innerHTML =
      '<div class="map-picker-box">' +
        '<div class="map-picker-title">🗺️ 选择地图应用</div>' +
        '<div class="map-picker-sub">查看「' + (name || '') + '」的位置，本次选择将记住 30 分钟</div>' +
        '<div class="map-picker-options">' +
          '<div class="map-picker-option" data-provider="amap">' +
            '<div class="mp-ico amap">🗺️</div>' +
            '<div><div class="mp-name">高德地图</div><div class="mp-desc">网页版 · 精准标记</div></div>' +
          '</div>' +
          '<div class="map-picker-option" data-provider="baidu">' +
            '<div class="mp-ico baidu">📍</div>' +
            '<div><div class="mp-name">百度地图</div><div class="mp-desc">网页版 · 精准标记</div></div>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="map-picker-cancel">取消</button>' +
      '</div>';
    document.body.appendChild(mask);

    function close() {
      mask.classList.remove('show');
      setTimeout(function () { mask.remove(); }, 200);
    }
    mask.querySelectorAll('.map-picker-option').forEach(function (opt) {
      opt.addEventListener('click', function () {
        var provider = opt.getAttribute('data-provider');
        saveMapChoice(provider);
        close();
        window.open(mapUrl(provider, name, lat, lng), '_blank');
      });
    });
    mask.querySelector('.map-picker-cancel').addEventListener('click', close);
    mask.addEventListener('click', function (e) {
      if (e.target === mask) close();
    });

    requestAnimationFrame(function () { mask.classList.add('show'); });
  }

  /* 记录一次生成历史：按城市去重，最新在前，最多保留 20 条 */
  function recordHistory(item) {
    var hist = loadJSON(HIST_KEY);
    hist = hist.filter(function (h) { return h.to !== item.to; });
    hist.unshift({ to: item.to, from: item.from, days: item.days, persons: item.persons, budget: item.budget, emoji: item.emoji, ts: Date.now() });
    if (hist.length > 20) hist.length = 20;
    saveJSON(HIST_KEY, hist);
  }

  /* 是否已收藏某城市 */
  function isFav(name) {
    return loadJSON(FAV_KEY).some(function (f) { return f.name === name; });
  }
  /* 切换收藏状态，返回收藏后是否处于已收藏 */
  function toggleFav(name, emoji) {
    var favs = loadJSON(FAV_KEY);
    var i = -1;
    for (var k = 0; k < favs.length; k++) if (favs[k].name === name) { i = k; break; }
    if (i >= 0) {
      favs.splice(i, 1);
      saveJSON(FAV_KEY, favs);
      return false;
    } else {
      favs.unshift({ name: name, emoji: emoji || '', ts: Date.now() });
      if (favs.length > 50) favs.length = 50;
      saveJSON(FAV_KEY, favs);
      return true;
    }
  }

  /* ===== 行程可编辑（增删 / 排序 / 本机保存） ===== */
  var EDIT_KEY = 'xj-trip-edit-v1-';

  function editKey() {
    return EDIT_KEY + state.from + '|' + state.to + '|' + state.days;
  }

  function saveEdit() {
    if (!state) return;
    try {
      localStorage.setItem(editKey(), JSON.stringify(state.plan));
    } catch (e) { /* 忽略存储失败 */ }
  }

  function loadEdit() {
    if (!state) return null;
    try {
      var raw = localStorage.getItem(editKey());
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function clearEdit() {
    if (!state) return;
    try {
      localStorage.removeItem(editKey());
      localStorage.removeItem(editKey() + '-pos');
    } catch (e) { /* 忽略 */ }
  }

  /* 记录最近一次修改的行程项位置（用于进入编辑时自动定位） */
  function saveEditPos(day, idx) {
    if (!state) return;
    try { localStorage.setItem(editKey() + '-pos', day + ':' + idx); } catch (e) { /* 忽略 */ }
  }
  function loadEditPos() {
    if (!state) return null;
    try {
      var raw = localStorage.getItem(editKey() + '-pos');
      if (!raw) return null;
      var parts = raw.split(':');
      var day = parseInt(parts[0], 10);
      var idx = parseInt(parts[1], 10);
      if (isNaN(day) || isNaN(idx)) return null;
      if (!state.plan[day] || !state.plan[day].items || !state.plan[day].items[idx]) return null;
      return { day: day, idx: idx };
    } catch (e) { return null; }
  }

  function applyEditIfAny() {
    /* 生成后若本机有该行程的编辑记录，则静默恢复内容，但不自动进入编辑模式；
       用户需手动点击「编辑行程」才会展开编辑控件 */
    if (!state) return;
    var saved = loadEdit();
    if (saved && Array.isArray(saved) && saved.length) {
      state.plan = saved;
    }
  }

  /* 同步行程项可编辑状态：仅编辑模式下允许点击改字 */
  function syncEditable() {
    if (!state) return;
    resultBox.querySelectorAll('.tl-time, .tl-body').forEach(function (el) {
      el.setAttribute('contenteditable', editMode ? 'true' : 'false');
    });
  }

  /* 侧边操作面板：展开/收起（统一入口，负责同步图标） */
  function setActionFloat(open) {
    var afBox = document.getElementById('action-float');
    var toggle = document.getElementById('af-toggle');
    if (afBox) afBox.classList.toggle('open', open);
    if (toggle) toggle.textContent = open ? '✕' : '⚙️';
  }

  /* 同步「收藏」按钮文字与状态（随 build 重建，故每次重新查找） */
  function updateFavBtn() {
    var btn = document.getElementById('btn-fav');
    if (!btn || !state) return;
    var on = isFav(state.to);
    btn.textContent = on ? '⭐ 已收藏' : '☆ 收藏城市';
    btn.classList.toggle('fav-on', on);
  }

  /* 进入编辑时，自动滚动定位到最近一次修改的行程项并高亮；
     若无修改记录，则定位到行程第一个行程项（D1 第一项） */
  function scrollToLastEdit() {
    if (!state) return;
    var item = null;
    var pos = loadEditPos();
    if (pos) {
      item = resultBox.querySelector('.tl-item[data-day="' + pos.day + '"][data-idx="' + pos.idx + '"]');
    }
    if (!item) {
      /* 无修改记录：定位到第一个行程项 */
      item = resultBox.querySelector('.tl-item');
    }
    if (!item) return;
    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
    item.classList.add('flash');
    setTimeout(function () { item.classList.remove('flash'); }, 1600);
  }

  function toggleEdit() {
    editMode = !editMode;
    if (editMode) {
      toast('✏️ 已进入编辑模式，点击文字即可修改行程项');
    } else {
      saveEdit();
      toast('💾 行程修改已保存到本机');
    }
    resultBox.classList.toggle('editing', editMode);
    var editBtn = document.getElementById('btn-edit');
    editBtn.textContent = editMode ? '✅ 完成编辑' : '✏️ 编辑行程';
    editBtn.classList.toggle('editing', editMode);
    syncEditable();
    if (editMode) {
      /* 进入编辑后定位到最近修改项（等待布局稳定后执行） */
      setTimeout(scrollToLastEdit, 60);
    }
  }

  function rerenderDays() {
    if (!state) return;
    var sec = document.getElementById('sec-days');
    var html = '<div class="section" id="sec-days"><h2>📋 每日详细行程</h2>';
    html += '<div class="edit-hint">✏️ 编辑模式：<strong>点击行程项的文字或时间即可直接修改</strong>，也可上下移动、删除、添加行程项或拖拽卡片排序；修改会自动保存到本机，点击「完成」退出编辑。</div>';
    if (state.level) {
      html += '<div class="callout callout-info">💡 本行程已按「' + state.level.label + '」档位生成：每日餐饮替换为' + (state.level.id === 'economy' ? '高性价比' : state.level.id === 'quality' ? '高品质' : '舒适') + '价位的当地推荐，整体消费控制在所选预算内。</div>';
    }
    state.plan.forEach(function (day, i) {
      html += '<div class="day-card" id="day-' + (i + 1) + '">' +
        '<div class="day-header"><div class="day-num">D' + (i + 1) + '</div><div class="day-title">' + esc(day.title) + '</div>' +
        (day.tag ? '<span class="tag">' + esc(day.tag) + '</span>' : '') +
        '<span class="day-arrow">▾</span></div>';
      html += '<div class="timeline">';
      (day.items || []).forEach(function (it, j) {
        html += '<div class="tl-item" data-day="' + i + '" data-idx="' + j + '" draggable="true">' +
          '<div class="tl-time" data-field="t">' + esc(it.t) + '</div>' +
          '<div class="tl-body" data-field="x">' + esc(it.x) + '</div>' +
          '<span class="tl-ops">' +
            '<button type="button" class="tl-op up" title="上移">↑</button>' +
            '<button type="button" class="tl-op down" title="下移">↓</button>' +
            '<button type="button" class="tl-op del" title="删除">✕</button>' +
          '</span></div>';
      });
      html += '</div>';
      html += '<div class="day-add"><button type="button" data-day="' + i + '">＋ 添加行程项</button></div></div>';
    });
    html += '</div>';
    sec.outerHTML = html;
    syncEditable();
  }

  /* 编辑操作：移动 / 删除 / 添加 */
  function moveItem(day, idx, dir) {
    var items = state.plan[day].items;
    var to = idx + dir;
    if (to < 0 || to >= items.length) return;
    var tmp = items[idx];
    items[idx] = items[to];
    items[to] = tmp;
    saveEdit();
    saveEditPos(day, to);
    rerenderDays();
  }

  function removeItem(day, idx) {
    state.plan[day].items.splice(idx, 1);
    if (!state.plan[day].items.length) {
      state.plan[day].items.push({ t: '全天', x: '🚶 自由安排：睡到自然醒，市区 City Walk 随走随拍' });
    }
    var posIdx = Math.max(0, idx - 1);
    saveEdit();
    saveEditPos(day, posIdx);
    rerenderDays();
  }

  function addItem(day) {
    state.plan[day].items.push({ t: '下午', x: '🚶 自由安排：按当天节奏灵活调整，累了就找家咖啡馆歇脚' });
    var newIdx = state.plan[day].items.length - 1;
    saveEdit();
    saveEditPos(day, newIdx);
    rerenderDays();
  }

  function fmt(n) {
    return '¥' + Math.round(n).toLocaleString('zh-CN');
  }

  function getPlan(city, days) {
    var plan = city.days[days];
    if (plan) return plan;
    var keys = Object.keys(city.days).map(Number).sort(function (a, b) { return a - b; });
    var best = keys[0];
    keys.forEach(function (k) {
      if (Math.abs(k - days) < Math.abs(best - days)) best = k;
    });
    return city.days[best];
  }

  /* 景点简称（去掉括号备注，便于在模板文案中匹配） */
  function spotShort(name) {
    return String(name).split('（')[0].split('(')[0].trim();
  }

  /* 模板天数不足时，用该城市景点/美食库自动补足天数；foods/spots 可传档位过滤后的池 */
  function extendPlan(city, plan, days, foods, spots) {
    if (plan.length >= days) return plan;
    var lastDay = plan[plan.length - 1];
    var core = plan.slice(0, plan.length - 1);
    var extra = days - plan.length;
    spots = spots || city.spots || [];
    foods = foods || city.foods || [];

    /* 收集模板中已出现的景点简称，避免补充日重复 */
    var used = {};
    plan.forEach(function (day) {
      (day.items || []).forEach(function (it) {
        spots.forEach(function (s) {
          var short = spotShort(s.name);
          if (short && it.x.indexOf(short) > -1) used[s.name] = 1;
        });
      });
    });
    /* 模板未覆盖的景点池，按顺序分配给补充日，用尽后降级为休闲日（绝不重复景点） */
    var pool = spots.filter(function (s) { return !used[s.name]; });

    /* 模板中已出现过的美食（含店名），补充日避开，避免「吃喝」重样 */
    var usedFood = {};
    plan.forEach(function (day) {
      (day.items || []).forEach(function (it) {
        foods.forEach(function (f) {
          if (it.x.indexOf(f.name) > -1) { usedFood[f.name] = 1; return; }
          var shops = String(f.shop || '').split(/[、,，\/]/);
          for (var m = 0; m < shops.length; m++) {
            var s = shops[m].trim();
            if (s.length >= 2 && it.x.indexOf(s) > -1) { usedFood[f.name] = 1; return; }
          }
        });
      });
    });
    var foodPool = foods.filter(function (f) { return !usedFood[f.name]; });
    if (!foodPool.length) foodPool = foods.slice(); /* 模板已吃遍全城，回退全量 */
    var foodCursor = 0;
    /* 依次取一道未用过的美食（补充日之间也不重样）；池只剩一款时返回 null，晚餐改通用文案 */
    function nextFood() {
      if (foodCursor >= foodPool.length) return null;
      var f = foodPool[foodCursor];
      foodCursor++;
      return f;
    }

    var added = [];
    for (var i = 0; i < extra; i++) {
      var n = core.length + i + 1;
      var f1 = nextFood();
      var f2 = nextFood();
      var s1 = pool[i * 2];
      var s2 = pool[i * 2 + 1];

      var title, tag, morning, afternoon;
      if (s1 && s2) {
        title = 'D' + n + ' ' + spotShort(s1.name) + ' · ' + spotShort(s2.name) + ' 深度慢游';
        tag = '深度慢游';
        morning = '🚶 ' + s1.name + '：' + s1.note;
        afternoon = '🌅 ' + s2.name + '：' + s2.note;
      } else if (s1) {
        title = 'D' + n + ' ' + spotShort(s1.name) + ' · 休闲慢游';
        tag = '休闲慢游';
        morning = '🚶 ' + s1.name + '：' + s1.note;
        afternoon = '🚶 市区街巷 City Walk，随走随拍，感受当地烟火气';
      } else {
        title = 'D' + n + ' 慢生活 · 自由探索';
        tag = '自由探索';
        morning = '😴 睡到自然醒，☕ 找家口碑店吃早午餐，开启慢节奏的一天';
        afternoon = '🚶 市区街巷 City Walk，随走随拍，感受当地烟火气';
      }

      /* 午餐/晚餐各取一款不重样的美食；池子只够一款时晚餐改为自由觅食 */
      var lunchTxt = f1 ? '🍽️ ' + f1.name + '（' + f1.shop + '）' : '🍽️ 当地口碑店午餐';
      var dinnerTxt = f2
        ? '🍜 晚餐：' + f2.name + '（' + f2.shop + '），饭后逛夜市/步行街'
        : '🍜 晚餐：夜市/美食街自由觅食，饭后散步消食';
      added.push({
        title: title,
        tag: tag,
        items: [
          { t: '上午', x: morning },
          { t: '中午', x: lunchTxt },
          { t: '下午', x: afternoon },
          { t: '傍晚', x: '🌆 找个观景位看日落，饭后散步消食' },
          { t: '晚间', x: dinnerTxt }
        ]
      });
    }
    /* 最后一天重编为返程日 */
    added.push({
      title: 'D' + days + ' 收尾 + 返程',
      tag: lastDay.tag,
      items: lastDay.items
    });
    return core.concat(added);
  }

  /* 参考青岛写法：为行程缺失午餐的日子自动补上「值得吃的中午饭」；foods 可传档位过滤后的池 */
  function ensureLunch(city, plan, foods) {
    foods = foods || city.foods || [];
    if (!foods.length) return plan;
    var cursor = 0;
    var usedAll = {}; /* 跨天已推荐过的美食，避免天天重样 */
    plan.forEach(function (day) {
      var items = day.items || [];
      var hasLunch = false, hasMorning = false, hasAfternoon = false;
      var morningTxt = '', afternoonTxt = '';
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (it.t.indexOf('中午') > -1) hasLunch = true;
        if (it.t.indexOf('上午') > -1) { hasMorning = true; morningTxt += it.x; }
        if (it.t.indexOf('下午') > -1 || it.t.indexOf('傍晚') > -1) { hasAfternoon = true; afternoonTxt += it.x; }
      }
      /* 把当天行程中已出现的美食/店名记入跨天已用（含模板已有午餐的天） */
      var allTxt = items.map(function (it) { return it.x; }).join('');
      foods.forEach(function (f) {
        if (allTxt.indexOf(f.name) > -1) { usedAll[f.name] = 1; return; }
        var shops = String(f.shop || '').split(/[、,，\/]/);
        for (var m = 0; m < shops.length; m++) {
          var s = shops[m].trim();
          if (s.length >= 2 && allTxt.indexOf(s) > -1) { usedAll[f.name] = 1; return; }
        }
      });
      if (hasLunch || !hasMorning || !hasAfternoon) return;
      /* 纯交通日（上午出发、下午抵达）中午在途中，不补 */
      if (/出发|返程|高铁|飞机|抵达|入住/.test(morningTxt) && /抵达|入住|返程/.test(afternoonTxt)) return;
      /* 判断美食是否与当天行程冲突（店名/美食名任一命中即冲突） */
      function clash(f) {
        if (allTxt.indexOf(f.name) > -1) return true;
        var shops = String(f.shop || '').split(/[、,，\/]/);
        for (var m = 0; m < shops.length; m++) {
          var s = shops[m].trim();
          if (s.length >= 2 && allTxt.indexOf(s) > -1) return true;
        }
        return false;
      }
      function findPick(skipUsed) {
        for (var k = 0; k < foods.length; k++) {
          var f = foods[(cursor + k) % foods.length];
          if (clash(f)) continue;
          if (skipUsed && usedAll[f.name]) continue;
          cursor = (cursor + k + 1) % foods.length;
          return f;
        }
        return null;
      }
      /* 优先选当天不冲突且跨天未用过的，全部用过则回退为当天不冲突即可 */
      var pick = findPick(true) || findPick(false) || foods[0];
      usedAll[pick.name] = 1;
      /* 插入到第一个「下午/傍晚」时段之前 */
      var at = items.length;
      for (var j = 0; j < items.length; j++) {
        if (items[j].t.indexOf('下午') > -1 || items[j].t.indexOf('傍晚') > -1) { at = j; break; }
      }
      items.splice(at, 0, { t: '中午', x: '🍽️ 午餐：' + pick.name + '（' + pick.shop + '）' });
    });
    return plan;
  }

  /* ===== 人均预算档位 ===== */
  var BUDGET_LEVELS = {
    economy: { id: 'economy', label: '经济实惠', range: [2000, 4000],  displayHigh: null,     desc: '参考二线城市消费水平' },
    comfort: { id: 'comfort', label: '舒适标准', range: [3500, 6500],  displayHigh: null,     desc: '参考新一线城市消费水平' },
    quality: { id: 'quality', label: '品质尊享', range: [5000, 10000], displayHigh: '10000+', desc: '参考一线城市消费水平' },
    auto: null
  };

  /* 解析 "300-450 元/晚" 之类的价格字符串，返回 [min, max]；无法解析返回 null */
  function parsePriceNum(str) {
    var m = String(str || '').match(/(\d+(?:\.\d+)?)\s*[-~至]\s*(\d+(?:\.\d+)?)/);
    if (m) return [parseFloat(m[1]), parseFloat(m[2])];
    m = String(str || '').match(/(\d+(?:\.\d+)?)/);
    if (m) return [parseFloat(m[1]), parseFloat(m[1])];
    return null;
  }

  /* 按预算档位筛选住宿：每晚房间价上限 ≈ (档位人均上限 - 往返交通) / 天数 × 0.9（默认双人拼房）。
     若全部超出则回退为按价格升序取最便宜的一家，并标记 fallback 供页面提示。 */
  function pickHotels(hotels, level, days, transport) {
    var list = (hotels || []).slice();
    if (!level) return { hotels: list, fallback: false };
    var cap = Math.max(150, Math.round((level.range[1] - transport[1]) / days * 0.9));
    var filtered = list.filter(function (h) {
      var p = parsePriceNum(h.price);
      return !p || p[1] <= cap;
    });
    if (filtered.length) return { hotels: filtered, fallback: false };
    list.sort(function (a, b) {
      var pa = parsePriceNum(a.price), pb = parsePriceNum(b.price);
      return (pa ? pa[0] : 1e9) - (pb ? pb[0] : 1e9);
    });
    return { hotels: list.slice(0, 1), fallback: true };
  }

  /* 解析价格为"人均参考值"（区间取中值，如 "150-250 元/人" → 200），免费/无法解析返回 null */
  function priceMid(str) {
    var p = parsePriceNum(str);
    if (!p) return null;
    return Math.round((p[0] + p[1]) / 2);
  }

  /* 人均参考文案：per 已含单位（元/人、元、元/只、元/斤等），无「元」时补默认单位，避免「元/人/人」 */
  function perTxt(per) {
    per = String(per || '');
    return '约' + per + (per.indexOf('元') > -1 ? '' : '元/人');
  }

  /* 各档位美食人均上限（按 priceMid 判断） */
  var FOOD_CAPS = { economy: 80, comfort: 200, quality: Infinity };

  /* 按档位过滤美食池：economy 只留低价小吃、comfort 中档、quality 高价位优先；
     过滤后不足 3 项则回退全量（保证清单可用）。 */
  function foodPoolForLevel(foods, level) {
    var list = (foods || []).slice();
    if (!level) return list;
    var cap = FOOD_CAPS[level.id] || Infinity;
    var rated = list.filter(function (f) {
      var m = priceMid(f.per);
      return m == null || m <= cap; /* 无价格信息视为可接受 */
    });
    if (rated.length >= 3) {
      if (level.id === 'quality') {
        rated.sort(function (a, b) { return (priceMid(b.per) || 0) - (priceMid(a.per) || 0); });
      }
      return rated;
    }
    if (level.id === 'quality') {
      list.sort(function (a, b) { return (priceMid(b.per) || 0) - (priceMid(a.per) || 0); });
    }
    return list; /* 回退全量 */
  }

  /* 按档位重排景点池：economy 免费/低价优先（必去景点保留，仅调序），quality 高票价优先 */
  function spotPoolForLevel(spots, level) {
    var list = (spots || []).slice();
    if (!level) return list;
    if (level.id === 'economy') {
      list.sort(function (a, b) {
        var pa = priceMid(a.ticket), pb = priceMid(b.ticket);
        return (pa == null ? 0 : pa) - (pb == null ? 0 : pb);
      });
      return list;
    }
    if (level.id === 'quality') {
      list.sort(function (a, b) {
        var pa = priceMid(a.ticket), pb = priceMid(b.ticket);
        return (pb || 0) - (pa || 0);
      });
    }
    return list;
  }

  /* 从档位美食池挑一家（轮询 + 跨天去重）；池中全部用过则返回 null，交回调用方保留原样，避免硬替换成重复美食 */
  function pickFoodForLevel(pool, used, cursor) {
    if (!pool.length) return null;
    for (var k = 0; k < pool.length; k++) {
      var f = pool[(cursor + k) % pool.length];
      if (!used[f.name]) { used[f.name] = 1; return f; }
    }
    return null;
  }

  /* 把行程中所有 🍽️/🍜 餐饮行按档位替换为对应价位的美食（auto 档不替换，保留数据原样） */
  function applyBudgetToPlan(plan, city, level) {
    if (!level) return plan;
    var pool = foodPoolForLevel(city.foods || [], level);
    if (!pool.length) return plan;
    var used = {};
    var cursor = 0;
    plan.forEach(function (day) {
      (day.items || []).forEach(function (it) {
        if (/[\u{1F37D}\u{1F35C}]/u.test(it.x)) { /* 🍽 / 🍜 码点匹配，避免误伤 🏛️ 等共享高代理的 emoji */
          var f = pickFoodForLevel(pool, used, cursor++);
          if (f) it.x = '🍽️ ' + f.name + '（' + f.shop + '，' + perTxt(f.per) + '）' + (f.note ? ' · ' + f.note : '');
        }
      });
    });
    return plan;
  }

  /* 最终去重巡检：吃喝不重样（同一美食每天最多 1 次、全程最多 2 次视为热门推荐），
     超出时替换为池中「当天未用且全程次数最少」的美食；替换不到则保留原样。
     兜底 auto 档模板本身的跨天重复（如大理白族三道茶连吃 4 天），以及档位替换/补餐产生的重复。 */
  function dedupePlan(plan, foods, altPool) {
    if (!foods || !foods.length) return plan;
    altPool = altPool && altPool.length ? altPool : foods;

    /* 从餐饮行文本识别归属美食。先剥离括号（店名/价格）与「· 备注」，避免
       「锅包肉（老边饺子馆…）」被店名里的美食名误判、或备注里的「羊肉汤底」干扰；
       name 命中为「确定归属」，店名命中仅计数不替换（避免共享店名误删/误换）；
       多个 name 互为子串（如「海鲜」⊂「海鲜水饺」）时取最长者 */
    function hitFood(txt) {
      var t = txt.replace(/（[^）]*）/g, '').replace(/\([^)]*\)/g, '').replace(/·.*$/g, '');
      var best = null;
      for (var i = 0; i < foods.length; i++) {
        var nm = foods[i].name;
        if (t.indexOf(nm) > -1 && (!best || nm.length > best.f.name.length)) {
          best = { f: foods[i], byName: true };
        }
      }
      if (best) return best;
      for (var i = 0; i < foods.length; i++) {
        var shops = String(foods[i].shop || '').split(/[、,，\/]/);
        for (var m = 0; m < shops.length; m++) {
          var s = shops[m].trim();
          if (s.length >= 2 && t.indexOf(s) > -1) return { f: foods[i], byName: false };
        }
      }
      return null;
    }

    var rows = [];
    plan.forEach(function (day, di) {
      (day.items || []).forEach(function (it) {
        if (/[\u{1F37D}\u{1F35C}]/u.test(it.x)) { /* 🍽 / 🍜 餐饮行 */
          rows.push({ day: di, it: it, h: hitFood(it.x) });
        }
      });
    });

    var seenTotal = {};   /* 已处理行中：美食名 -> 全程累计次数 */
    var seenPerDay = {};  /* 已处理行中：day|美食名 -> 当天次数 */
    function pickAlt(day) {
      var best = null;
      for (var i = 0; i < altPool.length; i++) {
        var f = altPool[i];
        if (seenPerDay[day + '|' + f.name]) continue;          /* 当天已出现 */
        var cnt = seenTotal[f.name] || 0;
        if (cnt >= 2) continue;                                /* 全程已达热门上限 */
        if (!best || cnt < (seenTotal[best.name] || 0)) best = f;
      }
      return best;
    }

    rows.forEach(function (r) {
      if (!r.h) return;
      var f = r.h.f;
      var key = r.day + '|' + f.name;
      seenTotal[f.name] = (seenTotal[f.name] || 0) + 1;
      seenPerDay[key] = (seenPerDay[key] || 0) + 1;
      /* 当天第 2 次 或 全程第 3 次起，视为重复需要替换（保留前 2 次 = 热门推荐）。
         仅 name 确定归属的行才替换，避免误伤作者店名写法 */
      var dup = seenPerDay[key] > 1 || seenTotal[f.name] > 2;
      if (!dup || !r.h.byName) return;
      var alt = pickAlt(r.day);
      if (!alt) return; /* 无可替换美食，保留原样 */
      seenTotal[alt.name] = (seenTotal[alt.name] || 0) + 1;
      seenPerDay[r.day + '|' + alt.name] = (seenPerDay[r.day + '|' + alt.name] || 0) + 1;
      var emoji = /[\u{1F35C}]/u.test(r.it.x) ? '🍜' : '🍽️';
      r.it.x = emoji + ' ' + alt.name + '（' + alt.shop + '，' + perTxt(alt.per) + '）' + (alt.note ? ' · ' + alt.note : '');
    });
    return plan;
  }

  /* ===== 就近不绕路 · 必去优先排序 ===== */

  /* 两点球面距离（米）。缺经纬度时返回 Infinity，触发降级排序 */
  function haversine(a, b) {
    if (!a || !b || a.lat == null || a.lng == null || b.lat == null || b.lng == null) return Infinity;
    var R = 6371000;
    var dLat = (b.lat - a.lat) * Math.PI / 180;
    var dLng = (b.lng - a.lng) * Math.PI / 180;
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) *
            Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(s));
  }

  /* 贪心最近邻排序：从起点出发，每次选距当前点最近的下一个，得到不绕路的访问顺序。
     - mustFirst 为 true 时，must 点优先（整体前置，组内保持就近）；为 false 时不做 must 前置
     - 缺经纬度的点距离视为 Infinity，排到末尾（保序）
     返回排序后的新数组（不修改原数组） */
  function nearestOrder(list, start, mustFirst) {
    list = (list || []).slice();
    if (list.length < 2) return list;
    var hasCoord = list.some(function (p) { return p.lat != null && p.lng != null; });
    if (!hasCoord) {
      /* 无任何经纬度：must 优先（若开启）、其余保序 */
      return mustFirst === false ? list : list.slice().sort(function (a, b) {
        return (b.must ? 1 : 0) - (a.must ? 1 : 0);
      });
    }
    var cur = start && start.lat != null ? start : null;
    var result = [];
    var pool = list.slice();
    while (pool.length) {
      var best = 0;
      var bestD = cur ? haversine(cur, pool[0]) : Infinity;
      for (var i = 1; i < pool.length; i++) {
        var d = cur ? haversine(cur, pool[i]) : Infinity;
        if (d < bestD) { bestD = d; best = i; }
      }
      var pick = pool.splice(best, 1)[0];
      result.push(pick);
      /* 下一站从当前选中的点继续延伸 */
      cur = (pick.lat != null && pick.lng != null) ? pick : cur;
    }
    /* must 优先重排：must 项整体前置，组内保持就近顺序（mustFirst=false 时跳过） */
    if (mustFirst !== false) {
      result.sort(function (a, b) { return (b.must ? 1 : 0) - (a.must ? 1 : 0); });
    }
    return result;
  }

  /* 按「组」就近排序：list 已按某规则排序（如档位：economy 免费优先 / quality 贵优先），
     按 groupKey 把相邻同组项切成若干组，组间保持原顺序（档位顺序不变），
     仅组内做就近贪心排序，避免就近算法覆盖档位排序。
     groupKey 返回分组标识（字符串）；返回 null/undefined 的项不分组、原样保留位置。 */
  function nearestWithinGroups(list, groupKey) {
    list = (list || []).slice();
    if (list.length < 2) return list;
    /* 先按 groupKey 切分：相邻相同组的项归为一组 */
    var groups = [];
    var curKey = null, curGroup = null;
    list.forEach(function (item) {
      var k = groupKey ? groupKey(item) : null;
      k = k == null ? '' : k;
      if (curGroup === null || k !== curKey) {
        curGroup = { key: k, items: [] };
        groups.push(curGroup);
        curKey = k;
      }
      curGroup.items.push(item);
    });
    /* 每组内做就近排序（不做 must 前置，保持组内价格序；must 由档位分组之外的
       必去清单逻辑负责），再按组顺序拼回 */
    var out = [];
    groups.forEach(function (g) {
      out = out.concat(nearestOrder(g.items, null, false));
    });
    return out;
  }

  /* 从景点列表挑选「必去 + 就近」的核心清单：先保证 must 全部入选，
     剩余名额按就近顺序补充（天数越少，砍掉的是可选项而非必去项） */
  function coreSpots(spots, maxCount) {
    var list = (spots || []).slice();
    var musts = list.filter(function (s) { return s.must; });
    var others = nearestOrder(list.filter(function (s) { return !s.must; }), musts.length ? musts[musts.length - 1] : null);
    var picked = musts.concat(others).slice(0, maxCount);
    return nearestOrder(picked, musts.length ? musts[0] : null);
  }

  function init() {
    /* 目的地搜索下拉（支持按名称搜索） */
    var toInput = document.getElementById('f-to');
    var toVal = document.getElementById('f-to-val');
    var toList = document.getElementById('f-to-list');

    function setTo(name) {
      toVal.value = name;
      toInput.value = name;
      toList.classList.remove('open');
    }

    function renderCityList(keyword) {
      keyword = (keyword || '').trim();
      var matched = list.filter(function (c) {
        if (!keyword) return true;
        return c.name.indexOf(keyword) > -1 || c.name.toLowerCase().indexOf(keyword.toLowerCase()) > -1;
      });
      var html = '';
      if (!matched.length) {
        html = '<li class="empty">未找到匹配城市</li>';
      } else {
        matched.forEach(function (c) {
          var emoji = CITY_DATA[c.name] ? CITY_DATA[c.name].emoji : '';
          html += '<li data-name="' + c.name + '"><span class="cs-emoji">' + emoji + '</span><span class="cs-name">' + c.name + '</span></li>';
        });
      }
      toList.innerHTML = html;
      toList.classList.add('open');
    }

    toInput.addEventListener('focus', function () {
      /* 聚焦即展示全部城市，并选中已输入文字便于直接覆盖重选 */
      renderCityList('');
      toInput.select();
    });
    toInput.addEventListener('input', function () {
      toVal.value = ''; /* 输入即视为重新选择 */
      renderCityList(toInput.value);
    });
    toList.addEventListener('mousedown', function (e) {
      var li = e.target.closest('li[data-name]');
      if (li) setTo(li.getAttribute('data-name'));
    });
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.city-search')) toList.classList.remove('open');
    });

    /* 提交生成 */
    document.getElementById('build-form').addEventListener('submit', function (e) {
      e.preventDefault();
      build();
    });

    /* 若有历史参数则直接生成（支持 ?to=青岛&days=6&persons=2 参数） */
    var qs = new URLSearchParams(location.search);
    if (qs.get('to')) {
      var qTo = qs.get('to');
      var found = list.some(function (c) { return c.name === qTo; });
      if (found) setTo(qTo);
      if (qs.get('days')) document.getElementById('f-days').value = qs.get('days');
      if (qs.get('persons')) document.getElementById('f-persons').value = qs.get('persons');
      if (qs.get('from')) document.getElementById('f-from').value = qs.get('from');
      var qBudget = qs.get('budget');
      if (qBudget && BUDGET_LEVELS.hasOwnProperty(qBudget)) document.getElementById('f-budget').value = qBudget;
      build();
    }
  }

  function build() {
    editMode = false; /* 每次重新生成默认退出编辑模式 */
    var fromInput = document.getElementById('f-from');
    var from = fromInput.value.trim() || '西安';
    fromInput.value = from;
    fromInput.disabled = true; /* 生成后锁定出发地 */
    var to = document.getElementById('f-to-val').value;
    var days = parseInt(document.getElementById('f-days').value, 10) || 5;
    var persons = parseInt(document.getElementById('f-persons').value, 10) || 2;

    var city = CITY_DATA[to];
    if (!city) {
      resultBox.className = 'result-wrap show';
      resultBox.innerHTML = '<div class="empty-tip">😕 该目的地暂未收录，敬请期待。</div>';
      resultBox.scrollIntoView({ behavior: 'smooth' });
      return;
    }

    /* 人均预算档位（选择档位后，预算数字、住宿、美食、景点、每日餐饮均按档位调整） */
    var budgetSel = document.getElementById('f-budget');
    var levelId = budgetSel ? budgetSel.value : 'auto';
    var level = BUDGET_LEVELS[levelId] || null;
    var levelFoods = foodPoolForLevel(city.foods || [], level);
    var levelSpots = spotPoolForLevel(city.spots || [], level);

    /* 就近不绕路 + 档位排序共存（方案一）：
       景点先按档位排序（economy 免费优先 / quality 高票价优先），再按「价格档」分组、
       组内就近贪心，既保留档位排序又保证同价位段内不绕路；必去项在组内前置。
       美食按「必吃优先」排序（不涉及经纬度，无需就近）。 */
    if (level) {
      levelSpots = nearestWithinGroups(levelSpots, function (s) {
        var p = priceMid(s.ticket);
        if (level.id === 'economy') {
          /* 免费 -> 低价 -> 中价 -> 高价（升序分组） */
          if (p == null || p === 0) return '0-免费';
          if (p <= 30) return '1-低价';
          if (p <= 80) return '2-中价';
          return '3-高价';
        }
        if (level.id === 'quality') {
          /* 高价 -> 中价 -> 低价 -> 免费（降序分组） */
          if (p == null || p === 0) return '3-免费';
          if (p <= 30) return '2-低价';
          if (p <= 80) return '1-中价';
          return '0-高价';
        }
        return ''; /* comfort 档：不分组，整体就近 */
      });
    } else {
      /* auto 档：无档位约束，直接就近不绕路 + 必去优先 */
      levelSpots = nearestOrder(levelSpots, null);
    }
    levelFoods = levelFoods.slice().sort(function (a, b) {
      return (b.must ? 1 : 0) - (a.must ? 1 : 0);
    });

    var plan = getPlan(city, days);
    var origPlanDays = plan.length;
    /* 深拷贝行程模板，避免后续按档位替换/补午餐时污染城市数据（否则切换档位后内容会残留） */
    plan = plan.map(function (day) {
      return { title: day.title, tag: day.tag, items: (day.items || []).map(function (it) { return { t: it.t, x: it.x }; }) };
    });
    plan = extendPlan(city, plan, days, levelFoods, levelSpots); /* 模板天数不足时自动补足 */
    var planDays = plan.length;
    var fallbackDays = planDays !== days;
    var nights = days - 1;
    ensureLunch(city, plan, levelFoods); /* 参考青岛，为行程补上「值得吃的中午饭」 */
    applyBudgetToPlan(plan, city, level); /* 按档位替换每日行程中的餐饮 */
    plan = dedupePlan(plan, city.foods || [], levelFoods); /* 最终去重巡检：吃喝每天不重样，热门推荐最多保留 2 次 */

    var b = city.budget || { perDay: [350, 450], transport: [500, 800] };
    var perLow, perHigh;
    if (level) {
      perLow = level.range[0];
      perHigh = level.range[1];
    } else {
      perLow = b.perDay[0] * days + b.transport[0];
      perHigh = b.perDay[1] * days + b.transport[1];
    }
    var perDayLv = [
      Math.max(100, Math.round((perLow - b.transport[0]) / days)),
      Math.max(150, Math.round((perHigh - b.transport[1]) / days))
    ];
    var totalLow = perLow * persons;
    var totalHigh = perHigh * persons;
    var hotelPick = pickHotels(city.hotels || [], level, days, b.transport);
    var shownHotels = hotelPick.hotels;
    var hotelFallback = hotelPick.fallback;
    var hotelTrimmed = shownHotels.length < (city.hotels || []).length;

    /* 出发地交通：from 为西安时用城市内置交通表；否则按两地直线距离估算高铁/飞机 */
    var transportRows = city.transport || [];
    var transportNote = '';
    var isXiAn = from === '西安';
    if (!isXiAn) {
      var est = estimateTransport(from, to);
      if (est) {
        transportRows = est.rows;
        transportNote = est.note;
      } else {
        transportNote = '⚠️ 出发地「' + esc(from) + '」暂无内置数据，以下为目的地常用交通参考，请以 12306 / 航司实时查询为准。';
      }
    }

    /* 记住本次生成的全部上下文（供导出 / 编辑 / 打印使用） */
    state = {
      from: from, to: to, days: days, nights: nights, persons: persons,
      city: city, level: level, plan: plan,
      levelFoods: levelFoods, levelSpots: levelSpots,
      shownHotels: shownHotels, hotelFallback: hotelFallback, hotelTrimmed: hotelTrimmed,
      transportRows: transportRows, transportNote: transportNote,
      b: b, perLow: perLow, perHigh: perHigh, perDayLv: perDayLv,
      totalLow: totalLow, totalHigh: totalHigh,
      fallbackDays: fallbackDays, origPlanDays: origPlanDays
    };

    /* 记录生成历史到 localStorage（供首页「我的足迹」展示） */
    recordHistory({ to: to, from: from, days: days, persons: persons, budget: levelId, emoji: city.emoji });

    var html = '';

    /* -------- 封面 -------- */
    html +=
      '<div class="guide-hero" style="background:' + city.cover + '">' +
        '<h2>' + city.emoji + ' ' + esc(from) + ' → ' + esc(to) + ' ' + days + '天' + nights + '晚 攻略</h2>' +
        '<div class="guide-sub">' + esc(city.tagline) + ' · 最佳旅行时间 ' + esc(city.bestMonths) + ' · ' + persons + ' 人同行</div>' +
        '<div class="chips">' +
          '<span class="chip">🌤️ ' + esc(city.bestMonths) + ' 最佳' + (city.weather ? ' · ' + esc(city.weather) : '') + '</span>' +
          '<span class="chip">🗓️ ' + days + '天' + nights + '晚</span>' +
          '<span class="chip">👥 ' + persons + ' 人</span>' +
          (level ? '<span class="chip">💎 ' + level.label + '档</span>' : '') +
          '<span class="chip">💰 人均 ' + fmt(perLow) + ' - ' + (level && level.displayHigh ? level.displayHigh : fmt(perHigh)) + '</span>' +
          '<span class="chip">💰 总计 ' + fmt(totalLow) + ' - ' + (level && level.displayHigh ? fmt(level.range[1] * persons) + '+' : fmt(totalHigh)) + '</span>' +
        '</div>' +
      '</div>';

    if (fallbackDays) {
      html += '<div class="notice">📌 该城市收录的行程模板为 ' + origPlanDays + ' 天，当前选择 ' + days + ' 天超出收录范围，已按最接近的模板生成。</div>';
    } else if (origPlanDays < days) {
      html += '<div class="notice">📌 已基于该城市景点与美食库，自动为你补足 D' + (origPlanDays + 1) + '~D' + days + ' 的深度慢游日程。</div>';
    }

    /* -------- 快捷导航 -------- */
    html += '<div class="quick-nav">' +
      '<a href="#sec-intro">🏙️ 简介</a>' +
      '<a href="#sec-transport">🚄 交通</a>' +
      '<a href="#sec-hotel">🏨 住宿</a>' +
      '<span class="drop"><button type="button" class="drop-btn">📋 每日行程</button><span class="drop-menu">' +
      plan.map(function (day, i) {
        return '<a href="#day-' + (i + 1) + '">D' + (i + 1) + ' · ' + esc(day.title) + '</a>';
      }).join('') +
      '</span></span>' +
      '<a href="#sec-food">🍴 美食</a>' +
      '<a href="#sec-spots">🎫 景点</a>' +
      '<a href="#sec-shopping">🛍️ 购物</a>' +
      '<a href="#sec-budget">💰 预算</a>' +
      '<a href="#sec-tips">⚠️ 避坑</a>' +
    '</div>';

    /* -------- 城市简介 -------- */
    html +=
      '<div class="section" id="sec-intro">' +
        '<h2>🏙️ 目的地简介</h2>' +
        '<p>' + esc(city.intro) + '</p>' +
      '</div>';

    /* -------- 交通（按出发地动态展示） -------- */
    html += '<div class="section" id="sec-transport"><h2>🚄 交通方案（基于' + esc(from) + '出发）</h2><div class="table-wrap"><table><tr><th>方式</th><th>班次/路线</th><th>耗时</th><th>参考价</th></tr>';
    transportRows.forEach(function (t) {
      html += '<tr><td><strong>' + esc(t.mode) + '</strong></td><td>' + esc(t.line) + '</td><td>' + esc(t.time) + '</td><td>' + esc(t.price) + '</td></tr>';
    });
    html += '</table></div>';
    if (transportNote) html += '<div class="callout callout-info">' + transportNote + '</div>';
    html += '<div class="callout callout-warn"><strong>购票提醒</strong>：节假日出行务必提前 15 天在 12306 / 航司 APP 购票，热门班次票源紧张。</div></div>';

    /* -------- 住宿 -------- */
    html += '<div class="section" id="sec-hotel"><h2>🏨 住宿推荐</h2><div class="table-wrap"><table><tr><th>类型</th><th>推荐区域</th><th>参考价/晚</th><th>特点</th></tr>';
    shownHotels.forEach(function (h) {
      html += '<tr><td><strong>' + esc(h.type) + '</strong></td><td>' + esc(h.rec) + '</td><td>' + esc(h.price) + '</td><td>' + esc(h.note) + '</td></tr>';
    });
    html += '</table></div>';
    if (hotelTrimmed) {
      html += '<div class="callout callout-info">💡 已按「' + level.label + '」预算档位筛除超出预算范围的酒店' + (hotelFallback ? '；该档位下预算内选择有限，以下为最接近预算的选项' : '') + '。</div>';
    }
    html += '<div class="callout callout-tip"><strong>住宿总预算</strong>（' + nights + '晚 × ' + persons + '人，按人均核算）：约 <strong>' + fmt(perDayLv[0] * 0.45 * nights) + ' - ' + fmt(perDayLv[1] * 0.45 * nights) + ' /人</strong>，已计入人均每日预算。</div></div>';

    /* -------- 每日行程（可编辑：编辑模式下支持增删/拖拽排序） -------- */
    html += '<div class="section" id="sec-days"><h2>📋 每日详细行程</h2>';
    html += '<div class="edit-hint">✏️ 编辑模式：<strong>点击行程项的文字或时间即可直接修改</strong>，也可上下移动、删除、添加行程项或拖拽卡片排序；修改会自动保存到本机，点击「完成」退出编辑。</div>';
    if (level) {
      html += '<div class="callout callout-info">💡 本行程已按「' + level.label + '」档位生成：每日餐饮替换为' + (level.id === 'economy' ? '高性价比' : level.id === 'quality' ? '高品质' : '舒适') + '价位的当地推荐，整体消费控制在所选预算内。</div>';
    }
    plan.forEach(function (day, i) {
      html += '<div class="day-card" id="day-' + (i + 1) + '">' +
        '<div class="day-header"><div class="day-num">D' + (i + 1) + '</div><div class="day-title">' + esc(day.title) + '</div>' +
        (day.tag ? '<span class="tag">' + esc(day.tag) + '</span>' : '') +
        '<span class="day-arrow">▾</span></div>';
      html += '<div class="timeline">';
      (day.items || []).forEach(function (it, j) {
        html += '<div class="tl-item" data-day="' + i + '" data-idx="' + j + '" draggable="true">' +
          '<div class="tl-time" data-field="t">' + esc(it.t) + '</div>' +
          '<div class="tl-body" data-field="x">' + esc(it.x) + '</div>' +
          '<span class="tl-ops">' +
            '<button type="button" class="tl-op up" title="上移">↑</button>' +
            '<button type="button" class="tl-op down" title="下移">↓</button>' +
            '<button type="button" class="tl-op del" title="删除">✕</button>' +
          '</span></div>';
      });
      html += '</div>';
      html += '<div class="day-add"><button type="button" data-day="' + i + '">＋ 添加行程项</button></div></div>';
    });
    html += '</div>';

    /* -------- 美食（按档位精选） -------- */
    html += '<div class="section" id="sec-food"><h2>🍴 地道美食清单</h2><div class="table-wrap"><table><tr><th>美食</th><th>推荐店铺</th><th>人均</th><th>备注</th></tr>';
    levelFoods.forEach(function (f) {
      html += '<tr><td><strong>' + esc(f.name) + '</strong></td><td>' + esc(f.shop) + '</td><td>' + esc(f.per) + '</td><td>' + esc(f.note) + '</td></tr>';
    });
    html += '</table></div>';
    if (level && levelFoods.length < (city.foods || []).length) {
      html += '<div class="callout callout-info">💡 已按「' + level.label + '」档位精选' + levelFoods.length + '/' + (city.foods || []).length + ' 项' + (level.id === 'economy' ? '高性价比小吃' : level.id === 'quality' ? '高品质正餐' : '主流美食') + '，其余超出档位区间未列出。</div>';
    } else if (level) {
      html += '<div class="callout callout-info">💡 已按「' + level.label + '」档位调整排序' + (level.id === 'quality' ? '，高价位推荐靠前' : '，低价亲民推荐靠前') + '。</div>';
    }
    html += '</div>';

    /* -------- 景点（按档位排序） -------- */
    html += '<div class="section" id="sec-spots"><h2>🎫 景点 & 活动参考</h2><div class="table-wrap"><table><tr><th>景点/项目</th><th>参考费用</th><th>建议时长</th><th>亮点</th><th>地图</th></tr>';
    levelSpots.forEach(function (s) {
      var hasLoc = typeof s.lat === 'number' && typeof s.lng === 'number';
      var mapCell = hasLoc
        ? '<a class="map-link" data-map-name="' + esc(s.name) + '" data-map-lat="' + s.lat + '" data-map-lng="' + s.lng + '">🗺️ 查看</a>'
        : '—';
      html += '<tr><td><strong>' + esc(s.name) + '</strong></td><td>' + esc(s.ticket) + '</td><td>' + esc(s.time) + '</td><td>' + esc(s.note) + '</td><td>' + mapCell + '</td></tr>';
    });
    html += '</table></div>';
    if (level && level.id === 'economy') {
      html += '<div class="callout callout-info">💡 已按「经济实惠」档位将免费/低价景点前置，方便控制门票开销；标志性景点仍全部保留。</div>';
    } else if (level && level.id === 'quality') {
      html += '<div class="callout callout-info">💡 已按「品质尊享」档位将高价值付费项目前置，可重点体验深度玩法。</div>';
    }
    html += '</div>';

    /* -------- 预算 -------- */
    html += '<div class="section" id="sec-budget"><h2>💰 预算估算</h2>';
    html += '<div class="budget-grid">' +
      '<div class="bud-item"><div class="amt">' + fmt(perLow) + ' - ' + (level && level.displayHigh ? level.displayHigh : fmt(perHigh)) + '</div><div class="lbl">⭐ 人均总预算（' + days + '天，含往返大交通）</div></div>' +
      '<div class="bud-item"><div class="amt">' + fmt(totalLow) + ' - ' + (level && level.displayHigh ? fmt(level.range[1] * persons) + '+' : fmt(totalHigh)) + '</div><div class="lbl">👥 ' + persons + ' 人总计</div></div>' +
      '<div class="bud-item"><div class="amt">' + fmt(perLow - b.transport[0]) + ' - ' + fmt(perHigh - b.transport[1]) + '</div><div class="lbl">💡 人均目的地消费（不含往返大交通）</div></div>' +
    '</div>';
    html += '<div class="callout callout-tip"><strong>说明</strong>：' +
      (level
        ? '本攻略已按「' + level.label + '」档位生成（' + level.desc + '，人均总预算 ' + fmt(perLow) + ' - ' + (level.displayHigh || fmt(perHigh)) + ' 元）。每日人均参考 ' + fmt(perDayLv[0]) + ' - ' + fmt(perDayLv[1]) + '（含住宿/餐饮/市内交通/门票），往返大交通人均 ' + fmt(b.transport[0]) + ' - ' + fmt(b.transport[1]) + '；住宿已按档位筛选，整体不超出所选预算。'
        : esc(b.note) + ' 人均每日参考 ' + fmt(b.perDay[0]) + ' - ' + fmt(b.perDay[1]) + '，往返大交通人均 ' + fmt(b.transport[0]) + ' - ' + fmt(b.transport[1]) + '。'
      ) + '人数越多住宿分摊越省，实际以出行时价格为准。</div>';
    html += '</div>';

    /* -------- 购物 & 特产 -------- */
    var specialties = city.specialties || [];
    var shopping = city.shopping || [];
    if (specialties.length || shopping.length) {
      html += '<div class="section" id="sec-shopping"><h2>🛍️ 本地特产 & 购物地</h2>';
      if (specialties.length) {
        html += '<h3 class="sub-h">🎁 必买特产</h3><div class="table-wrap"><table><tr><th>特产</th><th>参考价</th><th>推荐理由</th></tr>';
        specialties.forEach(function (sp) {
          html += '<tr><td><strong>' + esc(sp.name) + '</strong></td><td>' + esc(sp.price || '—') + '</td><td>' + esc(sp.note || '') + '</td></tr>';
        });
        html += '</table></div>';
      }
      if (shopping.length) {
        html += '<h3 class="sub-h">🏪 购物地推荐</h3><div class="table-wrap"><table><tr><th>购物地</th><th>位置</th><th>特色</th></tr>';
        shopping.forEach(function (sh) {
          html += '<tr><td><strong>' + esc(sh.name) + '</strong></td><td>' + esc(sh.area || '—') + '</td><td>' + esc(sh.note || '') + '</td></tr>';
        });
        html += '</table></div>';
      }
      html += '</div>';
    }

    /* -------- 避坑 -------- */
    html += '<div class="section" id="sec-tips"><h2>⚠️ 避坑指南 & 实用贴士</h2><ol style="padding-left:20px;line-height:2.1">';
    (city.tips || []).forEach(function (t) {
      html += '<li>' + esc(t) + '</li>';
    });
    html += '</ol></div>';

    /* -------- 侧边可收起的操作面板（编辑 / 复制 / 打印 / 夜间模式） -------- */
    html += '<div class="action-float" id="action-float">' +
      '<div class="af-menu">' +
        '<button type="button" class="btn btn-primary" id="btn-edit">✏️ 编辑行程</button>' +
        '<button type="button" class="btn" id="btn-reset">↩️ 还原默认</button>' +
        '<button type="button" class="btn" id="btn-copy-text">📋 复制行程文本</button>' +
        '<button type="button" class="btn" id="btn-copy-md">📝 复制 Markdown</button>' +
        '<button type="button" class="btn" id="btn-print">🖨️ 打印 / 保存 PDF</button>' +
        '<button type="button" class="btn" id="btn-fav">☆ 收藏城市</button>' +
        '<a class="btn" href="index.html">🏠 返回首页</a>' +
        '<div class="af-divider"></div>' +
        '<button type="button" class="btn" id="btn-dark">🌙 切换夜间模式</button>' +
      '</div>' +
      '<button type="button" class="af-toggle" id="af-toggle" title="操作" aria-label="操作菜单">⚙️</button>' +
    '</div>';

    resultBox.className = 'result-wrap show';
    resultBox.innerHTML = html;

    /* 若本机存有该行程的编辑记录，则静默恢复内容（保持浏览模式，不自动进入编辑）；
       用户需手动点击「编辑行程」才会展开编辑控件 */
    applyEditIfAny();
    if (editMode) {
      /* 理论上此处不会进入编辑模式（applyEditIfAny 不再置位），保留分支以防其它入口触发 */
      resultBox.classList.add('editing');
      var editBtn = document.getElementById('btn-edit');
      if (editBtn) {
        editBtn.textContent = '✅ 完成编辑';
        editBtn.classList.add('editing');
      }
    }
    rerenderDays();
    /* 同步面板内夜间按钮文字（面板随 build 重建，用 body 实时状态避免与缓存不一致） */
    applyDark(document.body.classList.contains('dark'));
    /* 同步收藏按钮状态（面板随 build 重建） */
    updateFavBtn();

    resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ===== 回顶部 ===== */
  var btnTop = document.getElementById('btn-top');
  window.addEventListener('scroll', function () {
    if (window.scrollY > 600) btnTop.classList.add('visible');
    else btnTop.classList.remove('visible');
  }, { passive: true });
  btnTop.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ===== 夜间模式 ===== */
  var isDark = localStorage.getItem('trip-guide-dark') === '1';
  function applyDark(on) {
    isDark = !!on;
    if (isDark) document.body.classList.add('dark');
    else document.body.classList.remove('dark');
    /* 同步面板内夜间按钮文字（按钮会随 build 重建，故每次重新查找） */
    var darkBtn = document.getElementById('btn-dark');
    if (darkBtn) darkBtn.textContent = isDark ? '☀️ 切换白天模式' : '🌙 切换夜间模式';
    localStorage.setItem('trip-guide-dark', isDark ? '1' : '0');
  }
  function toggleDark() {
    applyDark(!document.body.classList.contains('dark'));
  }
  applyDark(isDark);

  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'd' && e.ctrlKey) {
      e.preventDefault();
      toggleDark();
    }
    /* Esc：先关闭操作面板；若面板已关闭且处于编辑模式，则退出编辑 */
    if (e.key === 'Escape') {
      var afBox = document.getElementById('action-float');
      if (afBox && afBox.classList.contains('open')) {
        setActionFloat(false);
      } else if (editMode) {
        toggleEdit();
      }
    }
  });
})();
</script>
</body>
</html>
